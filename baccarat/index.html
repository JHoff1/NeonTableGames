  <body class="baccarat-page">
    <main class="baccarat-shell">
      <header class="game-top" aria-label="Game status">
        <div class="title-block">
          <nav class="game-switcher" aria-label="Game navigation">
            <a href="../index.html">All Games</a>
            <a href="../baccarat-rules/index.html">Baccarat Rules</a>
          </nav>
          <p class="eyebrow">Mini Baccarat</p>
          <h1><a class="title-home-link" href="../index.html">Neon Table Games</a></h1>
          <p class="game-disclaimer">Free play-money Mini Baccarat. No real-money wagering, deposits, prizes, or cash-out.</p>
          <button id="baccarat-new-game" class="secondary top-reset" data-tooltip="Reset the table and restore the starting bankroll">NEW GAME</button>
        </div>

        <div class="top-status">
          <div class="stats">
            <div>
              <span>Bankroll</span>
              <strong id="baccarat-bankroll">$1,000</strong>
            </div>
            <div>
              <span>Bet</span>
              <strong id="baccarat-bet">$0</strong>
            </div>
            <div>
              <span>Shoe</span>
              <strong id="baccarat-shoe">416</strong>
            </div>
            <div>
              <span>Best Run</span>
              <strong id="baccarat-high-bankroll">$1,000</strong>
            </div>
          </div>
        </div>
      </header>

      <section id="baccarat-felt" class="baccarat-felt" aria-live="polite">
        <aside id="baccarat-tutorial" class="baccarat-tutorial" aria-live="polite" hidden></aside>

        <section class="baccarat-hand-zone banker-side" aria-labelledby="banker-heading">
          <div class="baccarat-hand-heading">
            <h2 id="banker-heading">Banker</h2>
            <span id="banker-total" class="total">0</span>
          </div>
          <div id="banker-hand" class="baccarat-hand" role="group" aria-label="Banker hand"></div>
        </section>

        <section class="baccarat-center">
          <div id="baccarat-result" class="baccarat-result" hidden></div>
          <p id="baccarat-message">Choose Player, Banker, or Tie, then place a bet.</p>
          <div class="baccarat-history-wrap">
            <span>History</span>
            <div id="baccarat-history" class="baccarat-history" role="list" aria-label="Previous round results"></div>
          </div>
        </section>

        <section class="baccarat-hand-zone player-side" aria-labelledby="baccarat-player-heading">
          <div class="baccarat-hand-heading">
            <h2 id="baccarat-player-heading">Player</h2>
            <span id="baccarat-player-total" class="total">0</span>
          </div>
          <div id="baccarat-player-hand" class="baccarat-hand" role="group" aria-label="Player hand"></div>
        </section>
      </section>

      <section class="baccarat-controls" aria-label="Baccarat controls">
        <div class="bet-targets" aria-label="Choose a bet">
          <button class="bet-target player-bet" data-bet-type="player" aria-pressed="true" data-tooltip="Player wins pay 1 to 1">
            <span>Player</span>
            <strong>1:1</strong>
          </button>
          <button class="bet-target tie-bet" data-bet-type="tie" aria-pressed="false" data-tooltip="Tie wins pay 8 to 1">
            <span>Tie</span>
            <strong>8:1</strong>
          </button>
          <button class="bet-target banker-bet" data-bet-type="banker" aria-pressed="false" data-tooltip="Banker wins pay 0.95 to 1 after commission">
            <span>Banker</span>
            <strong>0.95:1</strong>
          </button>
        </div>

        <div class="baccarat-bet-row">
          <div class="chips baccarat-chips" aria-label="Bet chips">
            <button class="chip" data-baccarat-chip="5" data-tooltip="Add $5 to the selected bet"><span class="chip-dollar">$</span>5</button>
            <button class="chip" data-baccarat-chip="25" data-tooltip="Add $25 to the selected bet"><span class="chip-dollar">$</span>25</button>
            <button class="chip" data-baccarat-chip="100" data-tooltip="Add $100 to the selected bet"><span class="chip-dollar">$</span>100</button>
            <button class="chip" data-baccarat-chip="500" data-tooltip="Add $500 to the selected bet"><span class="chip-dollar">$</span>500</button>
          </div>

          <div class="baccarat-actions">
            <button id="baccarat-clear" class="secondary" data-tooltip="Return the current bet to your bankroll">Clear</button>
            <button id="baccarat-deal" class="primary" data-tooltip="Deal the selected Baccarat bet">Deal</button>
            <button id="baccarat-next" class="secondary" data-tooltip="Clear the table and prepare the next round">Next Round</button>
          </div>
        </div>
      </section>
    </main>

    <script src="../shared/game-core.js"></script>
