    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Neon Table Games Blackjack",
        "alternateName": "Free Online Blackjack",
        "url": "https://neontablegames.com/blackjack/",
        "applicationCategory": "GameApplication",
        "operatingSystem": "Any",
        "browserRequirements": "Requires JavaScript",
        "description": "A free browser blackjack game with classic table rules, betting chips, split hands, double down, and dealer play.",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "publisher": {
          "@type": "Organization",

          "url": "https://neontablegames.com/"
        },
        "inLanguage": "en-US",
        "isAccessibleForFree": true
      }
    </script>
  </head>
  <body>
    <main class="table-shell">
      <section class="game-top" aria-label="Game status">
        <div class="title-block">
          <p class="eyebrow">Blackjack</p>
          <h1><a class="title-home-link" href="../index.html">Neon Table Games</a></h1>
          <p class="game-disclaimer">Free play-money blackjack. No real-money wagering, deposits, prizes, or cash-out.</p>
          <button id="new-game" class="secondary top-reset" data-tooltip="Reset the table and restore your starting bankroll">NEW GAME</button>
        </div>
        <div class="top-status">
          <div class="stats">
            <div>
              <span>Bankroll</span>
              <strong id="bankroll">$1,000</strong>
            </div>
            <div>
              <span>Bet</span>
              <strong id="bet">$0</strong>
            </div>
            <div>
              <span>Cards</span>
              <strong id="shoe">52</strong>
            </div>
            <div class="best-run">
              <span>Best Run</span>
              <strong id="high-bankroll">$1,000</strong>
            </div>
          </div>
        </div>
      </section>

      <section class="felt" aria-live="polite">
        <div class="dealer-zone hand-zone">
          <div class="zone-header">
            <h2>Dealer</h2>
            <span id="dealer-total" class="total">0</span>
          </div>
          <div id="dealer-hand" class="hand"></div>
        </div>

        <div class="message-row">
          <div class="table-rules" aria-label="Table rules">
            <span>Blackjack pays 3 to 2</span>
            <span>Dealer hits soft 17</span>
          </div>
          <div id="table-bet-stack" class="table-bet-stack" aria-label="Wager on table"></div>
          <p id="message">Place your bet to start a hand.</p>
        </div>

        <div class="player-zone hand-zone">
          <div class="zone-header">
            <h2 id="player-heading">Player</h2>
            <span id="player-total" class="total">0</span>
          </div>
          <div id="player-hand" class="player-hands"></div>
        </div>
      </section>

      <section class="controls" aria-label="Game controls">
        <div class="chips" aria-label="Bet chips">
          <button class="chip" data-chip="5" data-tooltip="Add $5 to your bet"><span class="chip-dollar">$</span>5</button>
          <button class="chip" data-chip="25" data-tooltip="Add $25 to your bet"><span class="chip-dollar">$</span>25</button>
          <button class="chip" data-chip="100" data-tooltip="Add $100 to your bet"><span class="chip-dollar">$</span>100</button>
          <button class="chip" data-chip="500" data-tooltip="Add $500 to your bet"><span class="chip-dollar">$</span>500</button>
        </div>
        <div class="actions">
          <button id="clear-bet" class="secondary" data-tooltip="Return your current bet to your bankroll">Clear</button>
          <button id="deal" class="primary" data-tooltip="Start a hand with your current bet">Deal</button>
          <button id="split" data-tooltip="Split a matching pair into two hands">Split</button>
          <button id="stand" data-tooltip="End your turn and let the dealer play">Stand</button>
          <button id="hit" data-tooltip="Take one more card">Hit</button>
          <button id="double" data-tooltip="Double your bet, take one card, then stand">Double</button>
          <button id="next-hand" class="secondary" data-tooltip="Clear the table and keep your current bankroll">Next Hand</button>
        </div>
      </section>
    </main>

    <script src="../script.js"></script>
  </body>
</html>
